name: Storybook Image

# Proves the hosted-Storybook image builds and serves. Sliplane builds and deploys the same
# Dockerfile itself on every push to `main`, so this workflow does not publish an image: it is the
# gate that keeps a broken Dockerfile or Storybook build from reaching that deploy.

on:
  pull_request:
    branches: [main, development]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .storybook/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: spacecorps-storybook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name sb -p 8080:80 spacecorps-storybook:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -qi "storybook"
          curl -fsS http://127.0.0.1:8080/index.json | grep -q '"entries"'
          docker rm -f sb
